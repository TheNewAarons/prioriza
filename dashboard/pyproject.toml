[project]
name = "dashboard"
version = "0.1.0"
description = "Panel Dash de Prioriza."
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "dash>=2.18",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.24",
    "gunicorn>=22",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.scripts]
prioriza-dashboard = "dashboard.cli:main"

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
