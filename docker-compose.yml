# Variables desde .env (ver .env.example). Dentro de la red de compose el host de la DB es "db".
x-app-env: &app-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *app-env
      PRIORIZA_API_USERS_FILE: /app/config/users.json
    volumes:
      # Datos, modelos y resultados en solo lectura (los genera el host con make synth/train/simulate).
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./results:/app/results:ro
      # Usuarios: copia api/users.example.json a api/config/users.json y cambia las claves.
      - ./api/config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    env_file: .env
    environment:
      <<: *app-env
      PRIORIZA_DASHBOARD_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8050}:8050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
