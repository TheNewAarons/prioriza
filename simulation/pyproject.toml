[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "simulation"
version = "0.1.0"
description = "Simulación de políticas de programación para Prioriza."
requires-python = ">=3.12,<3.13"
dependencies = [
    "noshow",
    "numpy>=2.0",
    "polars>=1.0",
    "priority",
    "pydantic>=2.0",
    "scheduler",
    "shared",
    "simpy>=4.1",
    "synthetic",
    "typer>=0.12",
]

[project.scripts]
prioriza-simulate = "simulation.cli:run"

[tool.uv.sources]
shared = { workspace = true }
synthetic = { workspace = true }
priority = { workspace = true }
noshow = { workspace = true }
scheduler = { workspace = true }
