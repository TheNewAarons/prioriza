[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "noshow"
version = "0.1.0"
description = "Modelo de predicción de inasistencias para Prioriza."
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.4",
    "numpy>=2.0",
    "polars>=1.0",
    "scikit-learn>=1.6",
    "shared",
    "synthetic",
    "typer>=0.12",
]

[project.scripts]
prioriza-noshow = "noshow.cli:main"

[tool.uv.sources]
shared = {workspace = true}
synthetic = {workspace = true}
