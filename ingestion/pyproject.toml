[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "ingestion"
version = "0.1.0"
description = "Descarga y procesamiento de datos públicos agregados para Prioriza."
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "polars>=1.0",
    "fastexcel>=0.11",
    "typer>=0.12",
]

[project.scripts]
prioriza-ingest = "ingestion.cli:main"

[tool.uv.sources]
shared = {workspace = true}
