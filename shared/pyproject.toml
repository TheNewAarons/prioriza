[project]
name = "shared"
version = "0.1.0"
description = "Configuración, acceso a base de datos y utilidades compartidas de Prioriza."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
