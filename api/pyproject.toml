[project]
name = "api"
version = "0.1.0"
description = "API FastAPI de Prioriza."
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "priority",
    "noshow",
    "scheduler",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "polars>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
# `synthetic` solo para generar una corrida chica en los tests.
dev = ["synthetic"]

[tool.uv.sources]
shared = { workspace = true }
priority = { workspace = true }
noshow = { workspace = true }
scheduler = { workspace = true }
synthetic = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
