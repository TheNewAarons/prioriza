[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "prioriza"
version = "0.1.0"
description = "Sistema de apoyo a la gestión de listas de espera hospitalarias en Chile."
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Prioriza Team", email = "sotoaaronsukoaisv@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "ingestion", "synthetic", "priority", "noshow", "scheduler", "simulation", "api", "dashboard"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["shared/src", "priority/src", "scheduler/src"]
mypy_path = ["shared/src", "priority/src", "scheduler/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = [
    "shared/tests",
    "ingestion/tests",
    "synthetic/tests",
    "priority/tests",
    "noshow/tests",
    "scheduler/tests",
    "simulation/tests",
    "api/tests",
    "dashboard/tests",
]
addopts = "--import-mode=importlib -q"
consider_namespace_packages = true
markers = [
    "db: requiere un PostgreSQL alcanzable (se omite si no hay conexión)",
]
